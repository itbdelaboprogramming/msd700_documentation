# Insert this block into /etc/apache2/sites-enabled/000-default-le-ssl.conf,
# INSIDE the <VirtualHost *:443> block, BEFORE the existing catch-all:
#   ProxyPass / http://localhost:3000/
# (same rule as the existing /docs exclusion above it — the catch-all must
# come last).

	# Webhook receiver for msd700_documentation auto-deploy (not public API,
	# only reachable through this path; listener itself binds 127.0.0.1 only)
	ProxyPass /services/msd700-webhook http://127.0.0.1:4701/webhook
	ProxyPassReverse /services/msd700-webhook http://127.0.0.1:4701/webhook

	# MSD700 VitePress docs — static build, auto-deployed on push to main
	ProxyPass /itbdelabo/docs !
	Alias /itbdelabo/docs /home/itbdelabo/ITBdeLabo/Documentation/msd700_documentation/docs/.vitepress/dist_live

	<Directory /home/itbdelabo/ITBdeLabo/Documentation/msd700_documentation/docs/.vitepress/dist_live>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
