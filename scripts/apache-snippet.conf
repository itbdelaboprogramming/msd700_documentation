# Insert this block into /etc/apache2/sites-enabled/000-default-le-ssl.conf,
# INSIDE the <VirtualHost *:443> block, BEFORE the existing catch-all:
#   ProxyPass / http://localhost:3000/
# (must come before the catch-all, same as the other /services/* rules above it).
#
# This REPLACES the older reverse-proxy-to-localhost:4700 version of the
# "ITB de Labo Docs" block. Apache now serves the built site straight off disk;
# there is no `vitepress preview` process behind it anymore. That is deliberate:
# `vitepress preview` uses sirv in production mode, which scans the output
# directory once at startup and caches each file's name and size. After a deploy
# rebuilt dist/ with new hashed asset names, that cache served 404s for every
# CSS/JS file and truncated index.html to its stale Content-Length. Apache stats
# every file per request, so a dist/ swap is picked up with no restart.

	# ITB de Labo Docs Webhook
	ProxyPass /services/msd700-webhook http://localhost:4701/webhook
	ProxyPassReverse /services/msd700-webhook http://localhost:4701/webhook

	# ── ITB de Labo Docs (VitePress static build) ───────────────────────────
	# Exclude the path from the catch-all reverse proxy so Apache serves it
	# locally. MUST appear BEFORE the "ProxyPass /" catch-all further down:
	# mod_proxy hooks translate_name ahead of mod_alias, so without this
	# exclusion the catch-all wins over the Alias regardless of ordering.
	ProxyPass /itbdelabo/docs !

	Alias /itbdelabo/docs /home/itbdelabo/ITBdeLabo/Documentation/msd700_documentation/docs/.vitepress/dist

	<Directory /home/itbdelabo/ITBdeLabo/Documentation/msd700_documentation/docs/.vitepress/dist>
		# MultiViews off: the rewrite below handles extensionless URLs
		# predictably, without content negotiation guessing at other files.
		Options -Indexes -MultiViews +FollowSymLinks
		AllowOverride None
		Require all granted
		DirectoryIndex index.html

		# config.mts sets cleanUrls: true, so pages are linked without the
		# .html suffix (/itbdelabo/docs/setup/prerequisites). Map those to the
		# real file on disk. Directories still fall through to DirectoryIndex.
		RewriteEngine On
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteCond %{REQUEST_FILENAME}.html -f
		RewriteRule ^ %{REQUEST_FILENAME}.html [L]

		ErrorDocument 404 /itbdelabo/docs/404.html

		<IfModule mod_headers.c>
			# HTML is rewritten on every build and references the hashed
			# asset names, so it must never be cached.
			<FilesMatch "\.html$">
				Header set Cache-Control "no-cache"
			</FilesMatch>
		</IfModule>
	</Directory>

	# Everything under assets/ carries a content hash in its filename, so a
	# changed file always arrives under a new URL, safe to cache forever.
	# (vp-icons.css sits at the root and is NOT hashed, so it stays out of this.)
	<Directory /home/itbdelabo/ITBdeLabo/Documentation/msd700_documentation/docs/.vitepress/dist/assets>
		<IfModule mod_headers.c>
			Header set Cache-Control "max-age=31536000, immutable"
		</IfModule>

		# See "Developer section gate" below: this FilesMatch is the other half
		# of that gate, not a separate feature. Required here too, or it's not a
		# gate at all: read the comment there before touching either block.
		AuthType Basic
		AuthName "MSD700 Docs: Developer section"
		AuthUserFile /etc/apache2/msd700-docs.htpasswd
		<FilesMatch "^development_">
			Require valid-user
		</FilesMatch>
		<FilesMatch "^(?!development_)">
			Require all granted
		</FilesMatch>
	</Directory>

	# ── Developer section gate ──────────────────────────────────────────────
	# Basic Auth on /development/. The password file lives OUTSIDE this repo
	# and outside docs/.vitepress/dist (both are wiped/rebuilt by every
	# deploy, see deploy.sh's `git reset --hard` and dist_new/dist swap), at
	# a fixed path Apache reads directly. Create/update it with:
	#   sudo htpasswd -c /etc/apache2/msd700-docs.htpasswd <username>   # -c only the FIRST time
	# cleanUrls means every /development/* page resolves to a .html file
	# under this same directory, so one <Directory> block covers all of them.
	#
	# THIS ALONE IS NOT ENOUGH. VitePress is a client-hydrated SPA build: each
	# page's full rendered content also ships as a separate JS chunk under
	# assets/ (needed for soft client-side navigation), named after the
	# source path: development_architecture.md.<hash>.js for this page, for
	# example, and dist/hashmap.json publicly lists every page's current
	# hash, gated or not. Gating only this <Directory> leaves every developer
	# page's full text fetchable, unauthenticated, straight from assets/,
	# hashmap.json literally handing out the URL. The FilesMatch block on the
	# assets/ Directory above is what actually closes that: it requires the
	# same login for any assets/ file whose name starts with `development_`,
	# so knowing the hash from hashmap.json no longer helps: the file itself
	# is still behind auth. Do not remove one half and keep the other.
	<Directory /home/itbdelabo/ITBdeLabo/Documentation/msd700_documentation/docs/.vitepress/dist/development>
		AuthType Basic
		AuthName "MSD700 Docs: Developer section"
		AuthUserFile /etc/apache2/msd700-docs.htpasswd
		Require valid-user
	</Directory>
